[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masksource-demo"
version = "1.0.0"
description = "Runnable reference implementation of MaskSource dual-shield provenance"
requires-python = ">=3.10"
dependencies = [
  "Flask>=2.3,<4",
  "numpy>=1.24,<3",
  "Pillow>=9.5,<12",
  "PyWavelets>=1.4,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.3,<9"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
